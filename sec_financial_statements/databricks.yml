bundle:
  name: sec_financial_statements
  uuid: 1b0191db-c8be-4ae1-b115-6b9f4a378268 # generate a new UUID for your bundle: python -c "import uuid; print(uuid.uuid4())"

include:
  - bundle/*/*.yml

# NOTE: when adding sync paths, the root folder of the bundle will shift to
# add the first common parent of all sync paths.  For example, if you add ../shared/notebooks,
# the root folder will become the parent folder of both the current bundle and shared.
# files/
# |-- demand/
# |-- shared/notebooks/
sync:
  paths:
    - . # this bundle
    - ../shared/notebooks # shared notebooks

# artifacts:
#   packout: # packout wheel artifact
#     type: whl
#     build: uv build --wheel
#     path: ../shared/packout

variables:
  # Service principal ID, must be overridden in targets
  # owner_sp_id:
  #   description: Service principal ID
  warehouse_id:
    description: The default SQL warehouse
    lookup:
      warehouse: Serverless Starter Warehouse
  target_catalog:
    description: The catalog where assets are created

presets:
  pipelines_development: true # set development to true for pipelines
  trigger_pause_status: PAUSED # default paused
  tags:
    bu: finance
    project: sec_financial_statements
    domain: finance

targets:
  # Target 'local' must exist in 'databricks.yml' for workspace authoring
  local:
    mode: development
    default: true
    workspace:
      # core-d-cus-adb
      host: https://dbc-d1866d54-256f.cloud.databricks.com/
    variables:
      target_catalog: operations

