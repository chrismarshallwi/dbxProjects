resources:
  jobs:
    get_data:
      name: get_data
      tasks:

        - task_key: get_data
          notebook_task:
            notebook_path: ../../src/sec_quarterly_statements/notebooks/get_data.py
            source: WORKSPACE

      queue:
        enabled: true
      parameters:
        - name: edw_catalog
          default: ${var.edw_catalog}
        - name: ops_catalog
          default: ${var.ops_catalog}

      tags:
        priority: SEC
      

