resources:
  jobs:
    dim_taxonomy:
      name: dim_taxonomy
      tasks:

        - task_key: download_taxonomies
          notebook_task:
            notebook_path: ../../src/change_tracking/notebooks/download_gaap_taxonomies
            source: WORKSPACE
          environment_key: arelle
        
        - task_key: build_taxonomies
          depends_on:
            - task_key: download_taxonomies
          notebook_task:
            notebook_path: ../../src/change_tracking/notebooks/build_gaap_taxonomies
            source: WORKSPACE
          environment_key: arelle
                
      queue:
        enabled: true
      parameters:
        - name: target_catalog
          default: ${var.target_catalog}
        - name: year
          default: ""

      tags:
        priority: P1
      
      environments:
        - environment_key: arelle
          spec:
            dependencies: 
              - arelle-release

