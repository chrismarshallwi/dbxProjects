resources:
  jobs:
    fact_daily_stock_price:
      name: fact_daily_stock_price
      tasks:

        - task_key: ingest_daily_stock_price
          notebook_task:
            notebook_path: ../../src/dim_company/notebooks/build_dim_company_exchange_identifier.py
            source: WORKSPACE
        
      queue:
        enabled: true
      parameters:
        - name: target_catalog
          default: ${var.target_catalog}

      environments:
        - environment_key: odpenv
          spec:
            environment_version: "4"
            dependencies:
              - pandas-datareader
      

