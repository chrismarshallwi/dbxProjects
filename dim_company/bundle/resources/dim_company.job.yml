resources:
  jobs:
    dim_company:
      name: dim_company
      tasks:

        - task_key: build_dim_company_exchange_identifier
          notebook_task:
            notebook_path: ../../src/dim_company/notebooks/build_dim_company_exchange_identifier.py
            source: WORKSPACE
        
        - task_key: build_dim_company_identifier
          notebook_task:
            notebook_path: ../../src/dim_company/notebooks/build_dim_company_identifier.py
            source: WORKSPACE

        - task_key: build_dim_company_sp_500
          notebook_task:
            notebook_path: ../../src/dim_company/notebooks/build_dim_company_sp_500.py

        - task_key: dim_company
          depends_on:
            - task_key: build_dim_company_exchange_identifier
            - task_key: build_dim_company_identifier
            - task_key: build_dim_company_sp_500
          sql_task: 
            file:
              path: ../../src/dim_company/sql/dim_company.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

      queue:
        enabled: true
      parameters:
        - name: target_catalog
          default: ${var.target_catalog}


      tags:
        data: dim_company
      

